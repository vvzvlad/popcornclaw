plugins {
    id 'com.android.application'
}

android {
    namespace 'com.omarchytv.home'
    compileSdk 34

    defaultConfig {
        applicationId 'xyz.vvzvlad.popcornclaw'   // PopcornClaw
        minSdk 24
        targetSdk 34
        versionCode 25
        versionName '2.13.8'
    }

    // PopcornClaw: the project's debug key launcher/debug.keystore.
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    // PopcornClaw: the PicoClaw, TorrServer and ffprobe binaries ride in jniLibs as lib*.so (copied there by
    // the Makefile) so the installer extracts them as executable files; they are whole binaries, not libraries,
    // so AGP must not strip them (a stripped Go binary will not start).
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += '**/libpicoclaw.so'
            keepDebugSymbols += '**/libtorrserver.so'
            keepDebugSymbols += '**/libffprobe.so'
        }
    }

    buildTypes {
        release {
            // R8: the launcher plus only the Media3 parts it calls (exoplayer core; no ui, hls, dash).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // ./gradlew -PdevSuffix assembleDebug: installs next to a release build on an emulator.
            if (project.hasProperty('devSuffix')) applicationIdSuffix '.dev'
        }
    }

    lint {
        // The launcher is sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk
        // does not apply; without this, lintVitalRelease fails assembleRelease.
        disable 'ExpiredTargetSdkVersion'
        // A HOME app is reached with the Home button, not from an app row.
        disable 'MissingLeanbackLauncher'
        // API > minSdk calls crash Fire OS 6 / Android 7 at runtime (#59): fail the build instead (fatal = lintVitalRelease also aborts assembleRelease).
        fatal 'NewApi'
        abortOnError true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Send to TV player (PROTOCOL.md Cast): progressive MP4/MKV/WebM/MPEG-TS over http(s) and local files.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'   // v2.13: user IPTV playlists (HLS)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'   // PopcornClaw: PicoLink's WebSocket to the agent
    implementation 'com.google.zxing:core:3.5.3'   // PopcornClaw: QR for the control-panel URL on the home screen
    // JVM unit tests of the Omarchy Link core against omarchy-link/docs/vectors.json
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
